[project]
name = "ethiopia-smart-home"
version = "0.1.2"
description = "Ethiopian Smart Home platform for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kidus Solomon" }]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "hijri-converter==2.3.1",
  "prayer-times-calculator-offline==1.0.3",
  "PyYAML>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["custom_components"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["custom_components"]
include = ["ethiopia_core*", "ethiopia_religion*"]
